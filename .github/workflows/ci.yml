name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Self-checks
        run: sh tools/test.sh
      - name: Package skill
        run: sh tools/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: stackwright-skill
          path: dist/stackwright.zip
